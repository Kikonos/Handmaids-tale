<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script>
// Phones: draw the interface slightly smaller so a landscape phone holds the full layout (same rule as js/ui/device.js).
(function () { try {
  var ua = navigator.userAgent, l = localStorage.getItem('gilead-layout');
  var phone = l && l !== 'auto' ? l === 'phone' : /iPhone|iPod/.test(ua) || (/Android/.test(ua) && /Mobile/.test(ua));
  if (!phone || !navigator.maxTouchPoints) return;
  var k = Math.max(0.8, Math.min(1, Math.min(screen.width, screen.height) / 470)).toFixed(3);
  document.querySelector('meta[name=viewport]').setAttribute('content', 'width=device-width, initial-scale=' + k + ', minimum-scale=' + k + ', maximum-scale=' + k + ', user-scalable=no, viewport-fit=cover');
} catch (e) {} })();
</script>
